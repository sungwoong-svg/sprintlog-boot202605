plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sprintlog'
version = '0.0.1-SNAPSHOT'
description = 'sprintlog-boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // hateoas: 응답에 _links(자기 자신과 연관된 리소스로 가는 링크)를 붙여주는 라이브러리
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'

    // Spring AOP - @Aspect / @Around 로 횡단 관심사 (로깅, 실행시간) 분리
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // 재시도를 어노테이션으로 간단하게 (AOP 스타터가 있어야 동작합니다.)
    implementation 'org.springframework.retry:spring-retry'

    // Spring Data JPA(표준) 위에 추상화 객체를 얹어서 JPA를 좀 더 편하게 사용할 수 있는 라이브러리
    // 구현체 Hibernate가 포함되어 있습니다.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // actuator - 애플리케이션 모니터링(상태, 정보, 지표)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'

    // [신규] Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Spring과 PostgreSQL을 연동할 수 있는 드라이버
    runtimeOnly 'org.postgresql:postgresql'


    // 테스트 코드에서도 Lombok 사용
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // H2 인메모리 데이터베이스(테스트 전용 DB)
    // 테스트는 빠르고 독립적으로 돌아야 하므로 가벼운 인메모리 H2를 사용, 개발 및 운영은 postgres를 사용
    testRuntimeOnly 'com.h2database:h2'

    // Swagger/OpenAPI 추가
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
    // 쿼리 파라미터 추가 외부 로그 남기기 (콘솔에서 sql 자세히 보기)
    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'

    // AWS SDK forJava v2 (S3Client로 업로드/삭제, S3Presigner 로 presigned Url)
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:s3'

    // Adobe S3Mock - 로컬에서 진짜 S3 API 를 흉내내는 컨테이너.
    // 계정/토큰 불필요(LocalStack 은 2026-03 부터 토큰 필요) → S3 연동을 격리·재현 가능하게 테스트.
    testImplementation 'com.adobe.testing:s3mock-testcontainers:4.11.0'

    // JJWT - JWT 생성·서명·검증 라이브러리
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
}

tasks.named('test') {
    useJUnitPlatform()
}
