<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SprintLog 로그인</title>
  <!-- CSP(default-src 'self')가 인라인 <style>/<script>/style= 속성을 막으므로
       스타일·스크립트를 같은 출처 외부 파일(/assets/login.css, /assets/login.js)로 분리한다.
       이 페이지는 '정적(SPA 스타일)' 이라 서버가 _csrf hidden 필드를 박아줄 수 없어,
       login.js 가 XSRF-TOKEN 쿠키를 읽어 X-XSRF-TOKEN 헤더로 실어 보낸다(실제 React 흐름).
       (만약 Thymeleaf 같은 '서버 렌더링 폼' 이었다면 <input type="hidden" name="_csrf" th:value="${_csrf.token}"> 를 썼을 것이다.) -->
  <link rel="stylesheet" href="/assets/login.css" />
</head>
<body>
<div class="card">
  <h1>SprintLog 로그인</h1>
  <form id="loginForm">
    <label for="username">이메일</label>
    <!-- 파라미터 이름은 반드시 username/password (Spring Security formLogin 기본). 값은 우리 로그인 아이디인 email. -->
    <input id="username" name="username" type="text" placeholder="choon@naver.com" autofocus />

    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" placeholder="비밀번호" />

    <!-- '로그인 유지'(자동 로그인) 체크박스. name 은 SecurityConfig 의 rememberMeParameter("remember-me") 와 일치. -->
    <label class="remember">
      <input id="remember-me" name="remember-me" type="checkbox" />
      로그인 유지
    </label>

    <button type="submit">로그인</button>
  </form>
  <div id="msg" class="msg"></div>
</div>

<script src="/assets/login.js"></script>
</body>
</html>
