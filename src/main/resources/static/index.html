<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>CORS 데모 — 다른 출처에서 SprintLog API 부르기</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 48px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; }
    .box { background: #f5f6f8; border-radius: 8px; padding: 16px; margin: 16px 0; }
    b { color: #1a56db; }
    button { font-size: 15px; padding: 10px 18px; border: 0; border-radius: 6px; background: #1a56db; color: #fff; cursor: pointer; }
    pre { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
<h1>CORS 데모 — 다른 출처에서 SprintLog API 부르기</h1>

<div class="box">
  <div>이 페이지의 출처(origin): <b id="origin">...</b></div>
  <div>부를 API: <b>http://localhost:8080/api/v1/auth/whoami</b></div>
</div>

<p>아래 버튼을 누르면 이 페이지가 <b>다른 출처</b>의 우리 API 를 <code>fetch</code> 로 호출합니다.
  서버가 이 출처를 허용했으면 성공(초록), 허용 안 했으면 브라우저가 <b>CORS 로 차단</b>합니다.</p>

<button id="call">API 호출하기</button>

<pre id="out">여기에 결과가 표시됩니다…</pre>

<script>
  // 이 페이지의 origin 을 보여준다(예: http://localhost:63342 또는 http://localhost:3000).
  document.getElementById('origin').textContent = location.origin;

  document.getElementById('call').addEventListener('click', async () => {
    const out = document.getElementById('out');
    out.textContent = '호출 중…';
    try {
      // 다른 출처의 API 호출. 서버가 이 출처를 허용하지 않으면 브라우저가 응답을 막아 여기서 예외가 난다.
      const res = await fetch('http://localhost:8080/api/v1/auth/whoami');
      const data = await res.json();
      out.textContent = '✅ 성공 — 서버가 이 출처(' + location.origin + ')를 CORS 로 허용했습니다.\n\n'
          + JSON.stringify(data, null, 2);
    } catch (e) {
      out.textContent = '❌ 차단 — 브라우저가 CORS 로 막았습니다.\n'
          + '개발자도구(F12) 콘솔에 빨간 CORS 에러가 보일 거예요.\n'
          + '서버의 허용 목록(CorsConfigurationSource)에 이 출처(' + location.origin + ')가 없기 때문입니다.\n\n'
          + e;
    }
  });
</script>
</body>
</html>

```
