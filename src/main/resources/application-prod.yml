# 개발 환경 (dev profile) 추가 설정
# application.yml의 값들을 덮어쓰거나 보강
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sprintlog
    username: sprintlog
    password: sprintlog
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create

sprintlog:
  welcome-message: "SprintLog Boot - PRODUCTION (운영 환경)"
  sample-data:
    enabled: false
    count: 4

# 개발 시에는 자세한 로그가 도움됨.
logging:
  level:
    com.sprintlog: warn